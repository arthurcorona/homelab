services:
  postgres-db:
    image: postgres:16-alpine
    container_name: postgres_homelab 
    restart: always
    environment:
      POSTGRES_USER: nome_do_user
      POSTGRES_PASSWORD: senha_top
      POSTGRES_DB: nome_do_db_main
    ports:
      - "5432:5432"
    volumes:
      - ./data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d homelab_global"]
      interval: 10s
      timeout: 5s
      retries: 5
