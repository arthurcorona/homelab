services:
  postgres:
    image: postgres:16
    container_name: n8n-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD="C!7cIeGWFy#x0cOl%194fhNfKpVw4kE%OR%vN&dp3i5u*ru^!8eLkBOud4E&6k0$EHElv"
      - POSTGRES_DB=n8n
      - POSTGRES_NON_HOST_LOGIN=true
    volumes:
      - ./volumes/db_data:/var/lib/postgresql/data
    networks:
      - proxy-net  # Conecta na mesma rede do Nginx
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U n8n -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD="senha top"
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD="senhatop2"
      - WEBHOOK_URL=https://n8n.dominio.com.br
      # Otimização para Raspberry Pi
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168 #Deletar execuções com + de 7 dias
    volumes:
      - ./volumes/n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - proxy-net

networks:
  proxy-net:
    external: true
