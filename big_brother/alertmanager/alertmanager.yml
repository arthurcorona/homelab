global:
  resolve_timeout: 5m

route:
  receiver: 'discord'
  group_by: ['alertname', 'job']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h

receivers:
  - name: 'discord'
    discord_configs:
      - webhook_url: 'https://discord.com/api/webhooks/SEU_ID/SEU_TOKEN'
        send_resolved: true

templates:
  - '/etc/alertmanager/templates/*.tmpl'

